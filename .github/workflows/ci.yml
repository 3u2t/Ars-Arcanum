name: Ars Arcanum CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # C-03: weekly drift detection — catches action/toolchain rot between pushes
    - cron: '23 4 * * 1'

# C-03: least privilege — this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, Validate & Smoke Test (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils pandoc libxml2-utils xvfb gir1.2-gtk-3.0 gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 python3-gi

      - name: Set up Typst
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5.3
        with:
          typst-version: '0.14.2'

      - name: Print environment and tool versions
        run: |
          bash --version | head -n 1
          python3 --version
          pandoc --version | head -n 2
          typst --version
          shellcheck --version

      - name: Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Python security & static analysis (ruff)
        run: |
          pip install "ruff==0.16.8"
          ruff check .

      - name: Static type safety check (mypy)
        run: |
          pip install "mypy==1.15.0"
          mypy --config-file mypy.ini --explicit-package-bases scripts tests

      - name: Python AST Security Scan (bandit SAST)
        run: |
          pip install "bandit==1.8.3"
          bandit -r scripts/lib src/arcanum -ll -ii

      - name: Privacy & offline audit (no remote CDN URLs in engines)
        run: |
          ! grep -rnE "https://(cdn|unpkg|cdnjs|ajax)" scripts/lib/ src/arcanum/ || (echo "ERROR: remote CDN URL found in offline engine" >&2; exit 1)
          echo "  OK 100% offline asset verification passed"

      - name: Run Python unit tests with coverage
        run: |
          pip install "coverage==7.6.12"
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report --fail-under=80

      - name: Bash syntax validation (bash -n)
        run: |
          status=0
          for f in scripts/*.sh scripts/arcanum scripts/ars-arcanum; do
            [ -f "$f" ] || continue
            if ! bash -n "$f"; then
              echo "  FAIL $f (bash syntax)" >&2
              status=1
            else
              echo "  OK $f"
            fi
          done
          exit $status

      - name: ShellCheck static analysis
        run: |
          shellcheck -S warning scripts/*.sh scripts/arcanum scripts/ars-arcanum

      - name: Test Python wheel build and install
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl
          arcanum --version
          arcanum --help > /dev/null
          arcanum sprint-effort --help > /dev/null
          arcanum continuity-suite --help > /dev/null
          arcanum validate-epistemic --help > /dev/null
          arcanum timeline-audit --help > /dev/null
          arcanum conlang-check --help > /dev/null
          arcanum ledger-audit --help > /dev/null
          arcanum braid --help > /dev/null
          echo "  OK pip wheel build and CLI entrypoint installation passed"

      - name: Smoke test packaged CLI dispatch via symlink (PKG-01)
        run: |
          mkdir -p /tmp/pkg-test/share/ars-arcanum /tmp/pkg-test/bin
          cp -r scripts /tmp/pkg-test/share/ars-arcanum/scripts
          ln -sf /tmp/pkg-test/share/ars-arcanum/scripts/arcanum /tmp/pkg-test/bin/arcanum
          ln -sf /tmp/pkg-test/share/ars-arcanum/scripts/ars-arcanum /tmp/pkg-test/bin/ars-arcanum
          /tmp/pkg-test/bin/arcanum --version
          /tmp/pkg-test/bin/arcanum --help > /dev/null
          /tmp/pkg-test/bin/ars-arcanum --version
          echo "  OK symlinked CLI dispatches"

      - name: Validate JSON, YAML and XML configurations
        run: |
          python3 -c "import json; json.load(open('configs/leechblock_arcanum_rules.json')); json.load(open('configs/plugin_catalog.json')); json.load(open('configs/idioms.json')); print('  OK JSON configurations')"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('templates/manuscript/nwProject.nwx'); print('  OK nwProject XML')"
