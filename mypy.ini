[mypy]
python_version = 3.10
ignore_missing_imports = True
follow_imports = silent
allow_redefinition = True
check_untyped_defs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False
warn_unused_configs = False
show_error_codes = True
disable_error_code = no-redef, var-annotated, misc, union-attr, attr-defined, operator, index, assignment

[mypy-ui_gtk3.*]
ignore_errors = True

[mypy-lib.ui_gtk3.*]
ignore_errors = True

[mypy-ui_adw.*]
ignore_errors = True

[mypy-lib.ui_adw.*]
ignore_errors = True

[mypy-gi.*]
ignore_missing_imports = True
