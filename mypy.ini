[mypy]
python_version = 3.10
ignore_missing_imports = True
follow_imports = silent
allow_redefinition = True
check_untyped_defs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False
warn_unused_configs = False
show_error_codes = True
disable_error_code = no-redef, var-annotated, misc, union-attr, attr-defined, operator, index, assignment

# Strict Type Safety Enforcement for All Refactored & Continuity Modules (Phases 1-5 + UI Templates + Core IO & Sprints + Publishing/Portfolio + Heatmap)
[mypy-scripts.lib.vault_index,scripts.lib.phase_effort_engine,scripts.lib.diff_core,scripts.lib.typed_constitution,scripts.lib.epistemic_firewall,scripts.lib.timeline_solver,scripts.lib.conlang_linter,scripts.lib.resource_ledger,scripts.lib.narrative_braid,scripts.lib.vault_continuity_runner,scripts.lib.audit_hardening,scripts.lib.codex_export_template,scripts.lib.portfolio_template,scripts.lib.revision_heatmap_template,scripts.lib.velocity_template,scripts.lib.preflight_template,scripts.lib.omnibus_template,scripts.lib.lockfile,scripts.lib.fs_utils,scripts.lib.word_counter,scripts.lib.writing_sprint,scripts.lib.portfolio,scripts.lib.publisher,scripts.lib.preflight,scripts.lib.omnibus,scripts.lib.codex_export,scripts.lib.revision_heatmap]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
enable_error_code = var-annotated, union-attr, attr-defined, operator, index, assignment

[mypy-src.arcanum.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
enable_error_code = var-annotated, union-attr, attr-defined, operator, index, assignment

[mypy-ui_gtk3.*]
ignore_errors = True

[mypy-lib.ui_gtk3.*]
ignore_errors = True

[mypy-ui_adw.*]
ignore_errors = True

[mypy-lib.ui_adw.*]
ignore_errors = True

[mypy-gi.*]
ignore_missing_imports = True
