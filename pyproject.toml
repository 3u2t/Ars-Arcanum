[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ars-arcanum"
version = "0.1.0"
description = "Sovereign local-first authoring platform and speculative worldbuilding craft studio"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
arcanum = "scripts.lib.cli:main"
ars-arcanum = "scripts.lib.cli:main"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["scripts*", "arcanum*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B", "S", "UP", "SIM", "I", "RUF", "C901", "C4", "PIE", "RET", "RSE", "FLY"]
ignore = [
    "E501", # line length handled separately
    "S603", # subprocess call - check for execution of untrusted input
    "S607", # start_process with partial path
    "S311", # standard pseudo-random generators are fine for worldbuilding / fiction engines
    "S110", # try-except-pass intentional fallbacks
    "SIM105", # try-except-pass vs contextlib.suppress style choice
    "SIM117", # nested with statements
    "B905", # zip strict argument
    "S608", # SQL injection rule (parameterized SQLite FTS5 queries in vault_search/corpus_export; false positive on HTML/SQL templates)
    "RUF001", # ambiguous unicode characters (literals in conlangs / unicode typography)
    "RUF002", # ambiguous docstring unicode
    "RUF003", # ambiguous comment unicode
    "RUF012", # mutable class attributes
    "RUF022", # unsorted __all__ across layered facade exports
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S314", "E402", "I001"]
"scripts/lib/cli.py" = ["C901", "I001"]
"scripts/init_query.py" = ["W291", "I001"]
"scripts/lib/conlang_linter.py" = ["S314", "I001"]
"scripts/lib/docx_tracked_changes.py" = ["S314", "I001"]
"scripts/lib/restore.py" = ["C901", "SIM102", "SIM103", "RET505", "I001"]
"scripts/lib/audit_hardening.py" = ["S314", "C901", "SIM102", "RET504", "RET505", "I001"]
"src/arcanum/core/hardening.py" = ["S314", "C901", "SIM102", "RET504", "RET505", "I001"]
"scripts/apply_arcanum_upgrade.py" = ["I001"]
"scripts/sync_and_verify_docs.py" = ["I001"]
"scripts/arcanum-lite" = ["I001", "E402"]
"src/arcanum/*" = ["I001"]
"src/arcanum/**/*" = ["I001"]

[tool.ruff.lint.mccabe]
max-complexity = 40

[tool.coverage.run]
source = ["scripts/lib", "src/arcanum"]
branch = true
omit = [
    "scripts/lib/ui_gtk3/*",
    "scripts/lib/ui_gtk3.py",
    "scripts/lib/ui_adw.py",
    "scripts/lib/ui_controller.py",
    "tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
